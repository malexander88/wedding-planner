    <script>
      // Appearance before first paint (mirrors src/lib/theme.ts): no light flash for dark-mode users.
      (function () {
        try {
          var t = localStorage.getItem('wp.theme'), a = localStorage.getItem('wp.accent');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.theme = dark ? 'dark' : 'light';
          r.dataset.accent = /^(gold|rose|heather|sage)$/.test(a || '') ? a : 'gold';
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1712');
        } catch (e) {}
      })();
    </script>

    <script>
      // Restore a deep link bounced through 404.html (/base/?/budget -> /base/budget),
      // and add the trailing slash to a bare /base so the app and its service worker agree.
      (function (l) {
        var base = '/wedding-planner/'
        if (l.search[1] === '/') {
          var path = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + path + l.hash)
        } else if (base.length > 1 && l.pathname === base.slice(0, -1)) {
          window.history.replaceState(null, '', base + l.search + l.hash)
        }
      })(window.location)
    </script>

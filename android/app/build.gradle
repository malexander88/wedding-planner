plugins {
    id 'com.android.application'
}

// Release signing: secrets live in android/keystore.properties (git-ignored) or the file named by
// the KEYSTORE_PROPERTIES env var. Without it, release builds come out unsigned.
def keystorePropsFile = System.getenv('KEYSTORE_PROPERTIES') ? file(System.getenv('KEYSTORE_PROPERTIES')) : rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace 'io.github.malexander88.weddingplanner'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.malexander88.weddingplanner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        // Keep the web app's files exactly as built (no compression tricks needed; keeps byte-identical assets)
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    // No AndroidX: plain framework WebView keeps the APK small and dependency-free.
}
